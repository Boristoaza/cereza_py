<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | SocialApp</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-radius: 20px;
    }

    body {
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .register-card {
      border: none;
      border-radius: var(--card-radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      background-color: #ffffff;
      max-width: 850px;
      width: 100%;
      overflow: hidden; /* Mantiene las esquinas curvas con la imagen */
    }

    /* Columna izquierda de la imagen */
    .register-side-img {
      background-image: url('https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&w=600&q=80');
      background-size: cover;
      background-position: center;
      min-height: 100%;
    }

    .form-control {
      background-color: #f1f3f5;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      background-color: #e9ecef;
      box-shadow: none;
      outline: none;
    }

    .btn-pill {
      border-radius: 50px;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
    }
  </style>
</head>

<body>

  <div class="container p-3 d-flex justify-content-center">
    <div class="card register-card">
      <div class="row g-0">

        <div class="col-md-6 d-none d-md-block">
          <div class="register-side-img h-100"></div>
        </div>

        <div class="col-md-6 p-4 p-sm-5 d-flex flex-column justify-content-center">

          <div class="text-center mb-4">
            <h2 class="fw-bold text-primary mb-1">SocialApp</h2>
            <p class="text-muted small">Crea tu cuenta e inicia tu aventura</p>
          </div>

          {% if msg %}
          <div class="alert alert-warning border-0 small text-center py-2 mb-4 rounded-3" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i> {{ msg }}
          </div>
          {% endif %}

          <form action="{% url 'usuario:registro' %}" method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label for="nombre_usuerio" class="form-label small fw-bold text-muted ps-1">Nombre de usuario</label>
              <input type="text" name="nombre_usuerio" id="nombre_usuerio" class="form-control" placeholder="ej. boris_dev" required>
            </div>

            <div class="mb-3">
              <label for="correo" class="form-label small fw-bold text-muted ps-1">Correo electrónico</label>
              <input type="email" name="correo" id="correo" class="form-control" placeholder="tu@correo.com" required>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label small fw-bold text-muted ps-1">Contraseña</label>
              <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-pill w-100 shadow-sm mb-3">
              Registrarse
            </button>
          </form>

          <div class="text-center mt-3">
            <p class="small text-muted mb-0">
              ¿Ya tienes una cuenta?
              <a href="{% url 'usuario:login' %}" class="text-primary fw-semibold text-decoration-none ms-1">Inicia sesión</a>
            </p>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
