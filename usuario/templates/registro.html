<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse | Cereza 🍒</title>

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <style>
    /* TOKENS DE DISEÑO - CEREZA (IDÉNTICOS A TU GUÍA) */
    :root {
      --bg-black: #000000;
      --border-transparent: rgba(255, 255, 255, 0.08);
      --neon-red: #fe2c55;
      --neon-cyan: #25f4ee;
      --text-muted: rgba(255, 255, 255, 0.5);
    }

    body {
      background-color: var(--bg-black);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ESTILO FLOTANTE SIN CONTENEDOR ENMASCARADO */
    .register-wrapper {
      max-width: 340px;
      width: 100%;
      background: none;
    }

    /* BRAND LOGO IDENTICO AL NAVBAR */
    .brand-feed-style {
      color: #ffffff !important;
      font-weight: 800;
      letter-spacing: -0.5px;
      font-size: 1.8rem;
      text-decoration: none;
      display: inline-block;
    }

    /* INPUTS FLOTANTES LIMPIOS */
    .form-label {
      color: var(--text-muted) !important;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
    }

    .form-control-cereza {
      background-color: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid var(--border-transparent) !important;
      color: #ffffff !important;
      border-radius: 20px !important;
      padding: 10px 18px;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control-cereza:focus {
      border-color: var(--neon-cyan) !important;
      box-shadow: none !important;
      outline: none;
    }

    /* CONTENEDOR PASSWORD CON ICONO INTERNO */
    .input-group-cereza {
      position: relative;
      display: flex;
      width: 100%;
    }

    .btn-toggle-pass {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      z-index: 5;
      font-size: 1.1rem;
      padding: 0;
    }

    /* BOTÓN FLOTANTE PREMIUM */
    .btn-cereza-primary {
      background-color: var(--neon-red);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 11px 24px;
      font-weight: 700;
      font-size: 1rem;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-cereza-primary:hover {
      background-color: #e02247;
      color: #ffffff;
    }

    /* ALERTA PERSONALIZADA DE ERROR */
    .alert-custom {
      background-color: rgba(254, 44, 85, 0.1);
      border: 1px solid rgba(254, 44, 85, 0.2);
      color: #ff7890;
      font-size: 0.85rem;
    }

    /* FOOTER DE REGISTRO */
    .register-footer a {
      color: var(--neon-cyan);
      text-decoration: none;
      font-weight: 600;
    }

    .register-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="register-wrapper">

    <!-- Encabezado Minimalista -->
    <div class="text-center mb-5">
      <span class="brand-feed-style">Cereza 🍒</span>
    </div>

    <!-- Mensajes de Alerta Django (si existen) -->
    {% if msg %}
    <div class="alert alert-custom text-center py-2 mb-4 rounded-3" role="alert">
      <i class="bi bi-exclamation-circle me-2"></i> {{ msg }}
    </div>
    {% endif %}

    <!-- Formulario Flotante de Registro -->
    <form action="{% url 'usuario:registro' %}" method="post" autocomplete="off">
      {% csrf_token %}

      <!-- Nombre de Usuario -->
      <div class="mb-3">
        <label for="nombre_usuerio" class="form-label small fw-semibold ps-1">Nombre de usuario</label>
        <input type="text" name="nombre_usuerio" id="nombre_usuerio" class="form-control-cereza w-100" placeholder="ej. boris_dev" required autocomplete="off">
      </div>

      <!-- Correo Electrónico -->
      <div class="mb-3">
        <label for="correo" class="form-label small fw-semibold ps-1">Correo electrónico</label>
        <input type="email" name="correo" id="correo" class="form-control-cereza w-100" placeholder="tu@correo.com" required autocomplete="off">
      </div>

      <!-- Contraseña limpia con visor interactivo -->
      <div class="mb-4">
        <label for="password" class="form-label small fw-semibold ps-1">Contraseña</label>
        <div class="input-group-cereza">
          <!-- autocomplete="new-password" y value="" evitan de raíz los molestos puntos precargados -->
          <input type="password" name="password" id="password" class="form-control-cereza w-100" placeholder="Contraseña" required autocomplete="new-password" value="" style="padding-right: 45px;">
          <button type="button" class="btn-toggle-pass" onclick="togglePassword()">
            <i class="bi bi-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <!-- Botón Registrarse -->
      <button type="submit" class="btn-cereza-primary w-100 mb-4">
        Registrarse
      </button>
    </form>

    <!-- Enlace al Login -->
    <div class="text-center register-footer">
      <p class="small text-muted mb-0">
        ¿Ya tienes una cuenta?
        <a href="{% url 'usuario:login' %}">Inicia sesión</a>
      </p>
    </div>

  </div>

  <!-- Script para alternar visibilidad de contraseña -->
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('bi-eye');
        toggleIcon.classList.add('bi-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('bi-eye-slash');
        toggleIcon.classList.add('bi-eye');
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
