<form action="" method="post">
    {% csrf_token %}

    <input
        type="text"
        name="biografia"
        placeholder="Escribe tu biografía">

    <button type="submit">
        Guardar
    </button>
</form>
<style>
  .form_biografia{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.form_biografia textarea{
    width:100%;
    min-height:120px;
    resize:none;
    background:#1d1d1d;
    color:white;
    border:1px solid #2b2b2b;
    border-radius:14px;
    padding:15px;
    outline:none;
    font-size:15px;
}

.form_biografia textarea::placeholder{
    color:#888;
}

.form_biografia textarea:focus{
    border-color:#ff2a5f;
}

.btn_guardar_bio{
    width:100%;
    height:48px;
    border:none;
    border-radius:12px;
    background:#ff2a5f;
    color:white;
    font-weight:600;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    cursor:pointer;
    transition:.2s;
}

.btn_guardar_bio:hover{
    opacity:.9;
}
</style>
