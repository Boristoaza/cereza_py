<form action="" method="post" enctype="multipart/form-data" class="form_avatar">
    {% csrf_token %}

    <input type="file" name="avatar" id="avatar" hidden>

    <label for="avatar" class="btn_avatar">
        <i class="bi bi-camera-fill"></i>
        Cambiar foto de perfil
    </label>

    <button type="submit" class="btn_guardar_avatar">
        <i class="bi bi-check-lg"></i>
        Guardar
    </button>

</form>

<style>
  .form_avatar{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.btn_avatar{
    width:100%;
    height:50px;
    background:#1d1d1d;
    color:white;
    border:1px solid #2b2b2b;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    cursor:pointer;
    transition:.2s;
}

.btn_avatar i{
    font-size:22px;
    color:#ff2a5f;
}

.btn_avatar:hover{
    background:#252525;
}

.btn_guardar_avatar{
    width:100%;
    height:50px;
    background:#ff2a5f;
    color:white;
    border:none;
    border-radius:12px;
    font-weight:600;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    cursor:pointer;
    transition:.2s;
}

.btn_guardar_avatar:hover{
    opacity:.9;
}
</style>
