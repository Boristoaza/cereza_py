{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍒 Cereza</title>
    <!-- 1. Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- 2. Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos de Cereza -->
    <link rel="stylesheet" href="{% static 'css/master.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/aside.css' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/post_feed.css' %}">
    <link rel="stylesheet" href="{% static 'css/post_grid.css' %}">
</head>



<body>

    <!-- 1. Barra de Navegación Fija Superior -->
    <div class="navbar-contenedor">
        {% include 'components/navbar.html' %}
    </div>

    <!-- 2. Cuerpo Flexible de la App -->
    <div class="d-flex w-100">

        <!-- Barra Lateral Fija Izquierda -->
        <aside class="sidebar-web flex-shrink-0">
            {% include 'components/aside.html' %}
        </aside>

        <!-- 3. Contenedor Dinámico con Márgenes Corregidos -->
        <main class="main-profile-content flex-grow-1">
            {% block content %}
            <!-- Dejamos este espacio vacío. Aquí es donde Django meterá tus templates hijos -->
            {% endblock %}
        </main>

    </div>

</body>
</html>
