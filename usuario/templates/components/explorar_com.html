{% load static %}

<link rel="stylesheet" href="{% static 'css/explorar.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


<div class="contenedor_grid" >

    {% for x in "x"|rjust:"40" %}

    <div class="contenedor_post">

        <img src="https://picsum.photos/500/800?random={{ forloop.counter }}"
             class="imagen_post">

        <div class="likes">
            <i class="bi bi-heart"></i>
            <span>{{ forloop.counter }}K</span>
        </div>

        <div class="usuario">

            <img src="https://picsum.photos/80?random={{ forloop.counter|add:100 }}"
                 class="avatar">

            <span>@usuario{{ forloop.counter }}</span>

        </div>

    </div>

    {% endfor %}

</div>
