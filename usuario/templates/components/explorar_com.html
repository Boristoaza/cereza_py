{% load static %}

<link rel="stylesheet" href="{% static 'css/explorar.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


<div class="contenedor_grid">

    {% for publicacion in publicaciones %}

        {% for pack in publicacion.pack_set.all %}

            {% if pack.video %}

                <div class="contenedor_post">

                    <video
                        class="imagen_post"
                        src="{{ pack.video.url }}"
                        muted
                        loop
                        playsinline>
                    </video>

                    <div class="descripcion">
                        {{ publicacion.usuario }}
                    </div>

                </div>

            {% endif %}

        {% endfor %}

    {% endfor %}

</div>
