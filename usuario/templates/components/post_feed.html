{% load static %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{% static 'css/post_feed.css' %}">

<div class="contenedor_feed">
{% for i in post %}
<div class="contenedor_post">
    {% if i.post_original %}
       {% for pack in i.post_original.pack_set.all %}
          <img src="{{ pack.imagen.url }}" class="imagen_post">
      {% endfor %}
    {% else %}
      {% for pack in i.pack_set.all %}
          <img src="{{ pack.imagen.url }}" class="imagen_post">
      {% endfor %}
    {% endif %}

    <div class="degradado"></div>

    <div class="info">
        <h5>{{ i.usuario.perfil.nombre_usuario }}</h5>
        <p>{{ i.descripcion }}</p>
    </div>

    <div class="acciones">
        <div class="accion">
            <img src="/media/{{ i.usuario.perfil.avatar }}" class="avatar">
        </div>

        <div class="accion">
            <i class="bi bi-heart-fill"></i>
            <span>15.2K</span>
        </div>

        <div class="accion">
            <i class="bi bi-chat-fill"></i>
            <span>856</span>
        </div>

        <div class="accion">
            <i class="bi bi-send-fill"></i>
            <span>143</span>
        </div>

        <div class="accion">
            <i class="bi bi-bookmark-fill"></i>
            <span>92</span>
        </div>
    </div>

</div>
{% endfor %}
</div>
