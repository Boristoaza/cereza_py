<!-- 2. DETALLE INTERNO (PANTALLA COMPLETA + ASIDE DE COMENTARIOS) -->
<div class="offcanvas offcanvas-end tiktok-aside-detail" tabindex="-1" id="tiktokDetailCanvas">
    <div class="offcanvas-body p-0 text-white">
        <div class="row g-0 h-100">

            <!-- Izquierda: Contenido del Post -->
            <div class="col-12 col-md-8 media-preview-container">
                <button type="button" class="btn btn-dark rounded-circle position-absolute top-0 start-0 m-3 z-3 d-flex align-items-center justify-content-center" data-bs-dismiss="offcanvas" style="width: 40px; height: 40px; background-color: rgba(42,42,42,0.6); border: none;">
                    <i class="bi bi-x-lg text-white"></i>
                </button>
                <img id="asideImage" src="" alt="Post Detalle" style="max-width: 100%; max-height: 100vh; object-fit: contain;">
            </div>

            <!-- Derecha: El Aside Fijo para Comentarios -->
            <div class="col-12 col-md-4 comments-sidebar p-4">
                <!-- Autor y descripción -->
                <div class="mb-3">
                    <div class="d-flex align-items-center mb-3">
                        <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center fw-bold text-white me-2" style="width: 44px; height: 44px;">U</div>
                        <div>
                            <h6 class="m-0 fw-bold">usuario_dev</h6>
                            <small class="text-muted">Hace un momento</small>
                        </div>
                    </div>
                    <p id="asideDescription" class="fs-6 lh-sm text-white-50"></p>
                    <hr class="border-secondary">
                </div>

                <!-- Feed de Comentarios -->
                <div class="comments-list pe-1" id="asideCommentsContainer">
                    <!-- JavaScript inyectará los comentarios aquí -->
                </div>

                <!-- Input Inferior Fijo -->
                <div class="mt-3 pt-3 border-top border-secondary">
                    <form id="asideCommentForm" onsubmit="enviarComentarioAside(event)">
                        <div class="input-group">
                            <input type="text" id="asideCommentInput" class="form-control bg-dark border-secondary text-white rounded-start-pill px-3" placeholder="Añadir comentario..." autocomplete="off" required>
                            <button class="btn btn-light rounded-end-pill px-3" type="submit">
                                <i class="bi bi-send-fill text-dark"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- 3. LÓGICA DE INTERACCIÓN -->
<script>
    // Base simulada para desarrollo local
    const baseDatosComentarios = {
        1: [{ user: 'ana_tech', text: '¡Qué limpio se ve ese código!' }],
        2: [{ user: 'carlos_codex', text: 'Seguro faltó un punto y coma.' }],
        3: [{ user: 'rock_dev', text: '¡Pasa las tabs de esa rola! 🎸' }]
    };

    let postSeleccionadoId = null;
    let bscanvas = null;

    // Inicializar el Offcanvas de Bootstrap de manera segura
    document.addEventListener("DOMContentLoaded", function() {
        const htmlCanvasElement = document.getElementById('tiktokDetailCanvas');
        if (htmlCanvasElement) {
            bscanvas = new bootstrap.Offcanvas(htmlCanvasElement);
        }
    });

    function verDetallePost(id, urlImagen, descripcion) {
        postSeleccionadoId = id;

        document.getElementById('asideImage').src = urlImagen;
        document.getElementById('asideDescription').innerText = descripcion;

        dibujarComentarios();

        if (bscanvas) {
            bscanvas.show();
        }
    }

    function dibujarComentarios() {
        const contenedor = document.getElementById('asideCommentsContainer');
        if (!contenedor) return;

        contenedor.innerHTML = '';
        const lista = baseDatosComentarios[postSeleccionadoId] || [];

        if (lista.length === 0) {
            contenedor.innerHTML = '<p class="text-muted text-center my-4">Sé el primero en comentar...</p>';
            return;
        }

        lista.forEach(item => {
            const estructuraHtml = `
                <div class="d-flex align-items-start mb-3">
                    <div class="bg-dark border border-secondary rounded-circle d-flex align-items-center justify-content-center fw-bold text-white me-2 mt-1" style="width: 34px; height: 34px; font-size: 0.8rem; flex-shrink: 0;">${item.user[0].toUpperCase()}</div>
                    <div class="p-2 rounded-4 w-100 border border-secondary-subtle" style="background-color: #202124;">
                        <span class="fw-bold d-block text-white" style="font-size: 0.85rem;">${item.user}</span>
                        <span class="text-white-50" style="font-size: 0.9rem;">${item.text}</span>
                    </div>
                </div>
            `;
            contenedor.insertAdjacentHTML('beforeend', estructuraHtml);
        });

        contenedor.scrollTop = contenedor.scrollHeight;
    }

    function enviarComentarioAside(event) {
        event.preventDefault();
        const input = document.getElementById('asideCommentInput');
        const texto = input.value.trim();

        if (!texto || !postSeleccionadoId) return;

        if (!baseDatosComentarios[postSeleccionadoId]) {
            baseDatosComentarios[postSeleccionadoId] = [];
        }

        baseDatosComentarios[postSeleccionadoId].push({
            user: 'tu_usuario',
            text: texto
        });

        input.value = '';
        dibujarComentarios();
    }
</script>
