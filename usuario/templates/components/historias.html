{% load static %}
<link rel="stylesheet" href="{% static 'css/historias.css' %}">
<div class="continer_historias">

  <div class="text-center">
    <img src="https://picsum.photos/100/100?1" class="img_historia"
      alt="Historia"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal">
  </div>

  <div class="text-center">
    <img src="https://picsum.photos/100/100?2" class="img_historia"
      alt="Historia"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal">
  </div>

  <div class="text-center">
    <img src="https://picsum.photos/100/100?3" class="img_historia"
      alt="Historia"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal">
  </div>

  <div class="text-center">
    <img src="https://picsum.photos/100/100?4" class="img_historia"
      alt="Historia"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal">
  </div>

  <div class="text-center">
    <img src="https://picsum.photos/100/100?5" class="img_historia"
      alt="Historia"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal">
  </div>

  <div class="text-center">
    <img src="https://picsum.photos/100/100?6" class="img_historia"
      alt="Historia"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal">
  </div>

</div>

<!-- Modal -->
<div class="modal fade modal-instagram" id="exampleModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="barra-historia">
                <div class="progreso"></div>
            </div>

            <div class="modal-header">

                <div class="usuario">
                    <img src="https://picsum.photos/100" alt="">
                    <strong>isaac_toaza</strong>
                </div>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">
                <img src="https://picsum.photos/400/800"
                     class="historia-img">
            </div>

            <div class="modal-footer">

                <input
                    type="text"
                    class="form-control"
                    placeholder="Enviar mensaje..."
                >

            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
