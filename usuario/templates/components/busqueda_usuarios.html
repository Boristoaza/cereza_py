<div class="main-search-content">
    <div class="search-container-box">

        <h4 class="fw-bold mb-4 px-2" style="font-size: 1.4rem; letter-spacing: -0.3px;">
            Resultados de búsqueda
        </h4>

        <div class="d-flex flex-column gap-1">

            {% for i in busqueda %}

                <div class="user-search-card p-3 d-flex align-items-center justify-content-between">

                    <div class="d-flex align-items-center gap-3">

                        {% if i.avatar %}
                            <img
                                src="{{ i.avatar.url }}"
                                class="search-avatar"
                                alt="Avatar"
                            >
                        {% else %}
                            <img
                                src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde"
                                class="search-avatar"
                                alt="Avatar por defecto"
                            >
                        {% endif %}

                        <div>
                            <h6 class="mb-0 fw-bold text-white" style="font-size: 1.05rem;">
                                {{ i.nombre_usuario }}
                            </h6>

                            <p class="mb-0 text-secondary small">
                                ID de perfil: #{{ i.nombre_usuario }}
                            </p>
                        </div>

                    </div>

                    <a
                        href="/ver_perfil/{{ i.nombre_usuario }}"
                        class="tiktok-btn-primary"
                    >
                        <i class="bi bi-person-fill"></i>
                        Ver Perfil
                    </a>

                </div>

            {% empty %}

                <div class="text-center py-5 opacity-50">

                    <i class="bi bi-people fs-1"></i>

                    <p class="mt-3">
                        No se encontraron usuarios que coincidan con la búsqueda.
                    </p>

                </div>

            {% endfor %}

        </div>

    </div>
</div>
