{% load static %}
{% block css %}
<link rel="stylesheet" href="/usuario/static/css/seguidos_model.css">
{% endblock %}
<!-- Modal Seguidos (A quiénes sigue) -->
<div class="modal fade" id="seguidosModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content modal_seguidores">

            <div class="modal-header" style="background-color: black;">
                <h5 class="modal-title">Seguidos 🍒</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" style="text-decoration: none;"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body p-0" style="background-color: black;" id="lista_seguidos">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
   const usuario_seguido = "{{ perfil.nombre_usuario }}";

   const modalSeguidos = document.getElementById("seguidosModal");
   const listaSeguidos = document.getElementById("lista_seguidos");


modalSeguidos.addEventListener("shown.bs.modal", function () {

    axios.get(`/seguir/ver_seguidos/${usuario_seguido}/`)
        .then(response => {

            listaSeguidos.innerHTML = "";

            response.data.forEach(item => {

                listaSeguidos.innerHTML += `
                    <div class="usuario_seguidor">

                        <a href="/ver_perfil/${item.nombre_usuario}" style="text-decoration: none;">
                            <div class="usuario_info">

                                <img src="/media/${item.avatar}" class="avatar_usuario">

                                <div>
                                    <h6 >${item.nombre_usuario}</h6>
                                    <small>${item.username}</small>
                                </div>

                            </div>
                        </a>

                        <button class="btn btn-siguiendo-dark btn-sm">
                            Siguiendo
                        </button>

                    </div>
                `;
            });

        })
        .catch(error => {
            console.error(error);
        });

});
</script>
