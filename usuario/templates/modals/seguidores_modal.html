{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/seguidores.css' %}">
{% endblock %}

<!-- Modal Seguidores -->
<div class="modal fade" id="seguidoresModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content modal_seguidores">
            <div class="modal-header" style="background-color:black;">
                <h5 class="modal-title">Seguidores 🍒</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>

            <div class="modal-body p-0" style="background-color: black;">
                <div id="lista_seguidores"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const usuario_seguidor = "{{ perfil.nombre_usuario }}";

   const modalSeguidores = document.getElementById("seguidoresModal");
const listaSeguidores = document.getElementById("lista_seguidores");


modalSeguidores.addEventListener("shown.bs.modal", function () {

    axios.get(`/seguir/ver_seguidores/${usuario_seguidor}/`)
        .then(response => {

            listaSeguidores.innerHTML = "";

            response.data.forEach(item => {

                const avatar = item.avatar
                    ? `/media/${item.avatar}`
                    : "/static/img/avatar_default.png";

                listaSeguidores.innerHTML += `
                    <div class="usuario_seguidor">
                       <a href="/ver_perfil/${item.nombre_usuario}"style="text-decoration:none;">
                        <div class="usuario_info">
                            <img src="${avatar}" class="avatar_usuario">

                            <div>
                                <h6>${item.nombre_usuario}</h6>
                                <small>${item.username}</small>
                            </div>
                        </div>
                        </a>

                        <button class="btn btn-siguiendo-dark btn-sm">
                            Siguiendo
                        </button>

                    </div>
                `;
            });

        });

});


</script>
