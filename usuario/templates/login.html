{% extends "master.html" %}
{% load static %}

{% block content %}

<div class="login-wrapper">

    <!-- Encabezado -->
    <div class="text-center mb-5">
        <span class="brand-feed-style">Cereza 🍒</span>
    </div>

    <!-- Mensaje -->
    {% if msg %}
    <div class="alert alert-custom text-center py-2 mb-4 rounded-3" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i>
        {{ msg }}
    </div>
    {% endif %}

    <!-- Formulario -->
    <form action="{% url 'usuario:login' %}" method="post" autocomplete="off">
        {% csrf_token %}

        <!-- Usuario -->
        <div class="mb-3">
            <label for="nombre" class="form-label small fw-semibold ps-1">
                Correo o nombre de usuario
            </label>

            <input
                type="text"
                name="nombre"
                id="nombre"
                class="form-control-cereza w-100"
                placeholder="Nombre de usuario"
                required
                autocomplete="username">
        </div>

        <!-- Contraseña -->
        <div class="mb-4">
            <label for="password" class="form-label small fw-semibold ps-1">
                Contraseña
            </label>

            <div class="input-group-cereza">

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control-cereza w-100"
                    placeholder="Contraseña"
                    required
                    autocomplete="current-password"
                    style="padding-right:45px;">

                <button
                    type="button"
                    class="btn-toggle-pass"
                    onclick="togglePassword()">

                    <i class="bi bi-eye" id="toggleIcon"></i>

                </button>

            </div>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn-cereza-primary w-100 mb-4">
            Iniciar sesión
        </button>

    </form>

    <!-- Registro -->
    <div class="text-center login-footer">
        <p class="small text-muted mb-0">
            ¿No tienes una cuenta?
            <a href="{% url 'usuario:registro' %}">
                Registrarse
            </a>
        </p>
    </div>

</div>

{% endblock %}


{% block scripts %}
<script>

function togglePassword() {

    const passwordInput = document.getElementById("password");
    const toggleIcon = document.getElementById("toggleIcon");

    if (passwordInput.type === "password") {

        passwordInput.type = "text";
        toggleIcon.classList.replace("bi-eye", "bi-eye-slash");

    } else {

        passwordInput.type = "password";
        toggleIcon.classList.replace("bi-eye-slash", "bi-eye");

    }

}

</script>
{% endblock %}
